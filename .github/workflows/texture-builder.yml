name: Generate Block Data

on:
  push:
    paths:
      - 'assets/**'          # Runs whenever files in assets/ change
      - 'texture-builder.py' # Runs if you update the script itself

# Gives the workflow permission to commit changes back to your repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run block generator script
        run: python texture-builder.py

      - name: Commit and push BlockData.json if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add BlockData.json
          # Only commit and push if there are actual changes
          git diff --staged --quiet || (git commit -m "Auto-generate BlockData.json [skip ci]" && git push)
